name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

      - name: Check local assets
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          html = (root / 'index.html').read_text(encoding='utf-8')
          missing = []
          for value in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', html):
              if value.startswith(('http://','https://','mailto:','tel:','#','data:')):
                  continue
              clean = value.split('#',1)[0].split('?',1)[0]
              if clean and not (root / clean).exists():
                  missing.append(clean)
          for sample in ('samples/dane-testowe.csv','samples/dane-testowe.xlsx','samples/oferta-testowa.pdf'):
              if not (root / sample).exists():
                  missing.append(sample)
          if missing:
              print('Missing local files:', *missing, sep='\n- ')
              sys.exit(1)
          PY

      - name: Check browser privacy contract
        run: |
          grep -Fq "Nie jest wysyłany na serwer" index.html
          grep -Fq "cdn.jsdelivr.net/npm/xlsx@0.18.5" app.js
          grep -Fq "cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38" app.js
          if grep -E '\b(fetch|XMLHttpRequest|WebSocket)\s*\(' app.js lib/document-engine.mjs; then
            echo "Unexpected data-network code found in browser demo."
            exit 1
          fi
